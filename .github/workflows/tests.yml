name: tests

on:
  push:
  pull_request:

jobs:
  django:
    name: Django gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run gateway tests
        working-directory: backend
        run: python manage.py test gateway --verbosity=1

  nodes:
    name: Go ledger and CometBFT nodes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: nodes/go.mod
          cache-dependency-path: nodes/go.sum
      - name: Vet
        working-directory: nodes
        run: go vet ./...
      - name: Check formatting
        working-directory: nodes
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Unit tests (race detector) and coverage
        working-directory: nodes
        run: go test -race -cover $(go list ./... | grep -v /e2e)
      - name: Acceptance tests — scenarios 1-12, 14 and 15 on a 4-validator network
        working-directory: nodes
        run: go test -v -timeout 25m ./e2e

  oracle:
    name: Oracle service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run Oracle tests
        working-directory: oracle_service
        run: python -m unittest -v

  frontend:
    name: Web UI syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Check the SPA's JavaScript parses
        run: |
          python3 - <<'PY'
          import re
          html = open('backend/templates/index.html').read()
          scripts = re.findall(r'<script(?![^>]*src)[^>]*>(.*?)</script>', html, re.S)
          open('/tmp/app.js', 'w').write('\n'.join(scripts))
          PY
          node --check /tmp/app.js

  wallet:
    name: Wallet extension (scenario 13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install the test browser
        working-directory: wallet
        run: npm install --no-audit --no-fund && npx playwright-core install --with-deps chromium
      - name: Wallet core unit tests
        working-directory: wallet
        run: node --test core.test.mjs
      - name: Acceptance scenario 13 — a compromised gateway asks to sign a different quantity
        working-directory: wallet
        run: node test/scenario13.mjs
