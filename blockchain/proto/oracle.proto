syntax = "proto3";

package oracle;

option go_package = "github.com/trading/nodes/oracle";
option py_generic_services = true;

// PriceRequest is sent by a node asking for the current price of a stock
message PriceRequest {
  string ticker = 1;
}

// PriceResponse is returned by the oracle with the live execution price
message PriceResponse {
  string ticker          = 1;
  string execution_price = 2;
  string timestamp       = 3;  // when the Oracle produced this quote (freshness checks)
  string market_time     = 4;  // time of the market data the price comes from
}

// SignedQuote is one price source's quote, signed with that source's Ed25519
// key (registered in the genesis file). The signed bytes are
//   "tradedesk-quote|<source>|<ticker>|<price_cents>|<timestamp>"
message SignedQuote {
  string source      = 1;
  string ticker      = 2;
  int64  price_cents = 3;
  int64  timestamp   = 4;  // unix seconds
  bytes  signature   = 5;
}

// OracleService is the gRPC interface exposed by each oracle signer
service OracleService {
  // GetPrice returns the current price (display only, unsigned)
  rpc GetPrice (PriceRequest) returns (PriceResponse);

  // SignQuote returns a signed quote that consensus can verify
  rpc SignQuote (PriceRequest) returns (SignedQuote);
}
