syntax = "proto3";

package trading;

option go_package = "trading/proto;tradingpb";

// ============================================================================
// Core messages
// ============================================================================

enum Side {
  SIDE_UNSPECIFIED = 0;
  BUY  = 1;
  SELL = 2;
}

// Canonical order transaction. This is the exact byte layout that gets signed
// (serialized deterministically with protobuf) — nodes MUST verify the
// signature against this encoding.
message OrderTx {
  string order_id        = 1;   // UUID from Django (idempotency key)
  string user_id         = 2;
  string symbol          = 3;   // e.g. "AAPL"
  Side   side            = 4;
  string quantity        = 5;   // decimal as string ("1.5")
  string price           = 6;   // oracle price at submission ("187.25")
  int64  price_timestamp = 7;   // unix seconds, from oracle
  uint64 nonce           = 8;   // strictly increasing per user_id
  int64  submitted_at    = 9;   // unix seconds

  // limit_price is the worst price the user is willing to accept.
  //   BUY:  oracle_price MUST be <= limit_price (don't pay more than this)
  //   SELL: oracle_price MUST be >= limit_price (don't sell below this)
  // Empty string ("") means "no limit" — accept whatever the oracle says.
  string limit_price     = 10;
}

message SignedOrderTx {
  OrderTx tx        = 1;
  bytes   signature = 2; // ECDSA P-256 over sha256(proto-encoded tx)
  bytes   pub_key   = 3; // DER-encoded user public key (so nodes can verify)
}

// ============================================================================
// Blockchain primitives
// ============================================================================

message Block {
  uint64                 index         = 1;
  bytes                  prev_hash     = 2;
  int64                  timestamp     = 3;
  repeated SignedOrderTx txs           = 4;
  bytes                  leader_pubkey = 5;
  repeated bytes         signatures    = 6; // authority sigs (PoA votes)
  bytes                  hash          = 7;
}

// ============================================================================
// Django → Leader
// ============================================================================

message SubmitOrderRequest {
  SignedOrderTx signed_tx = 1;
}

enum OrderStatus {
  STATUS_UNSPECIFIED = 0;
  CONFIRMED          = 1;
  REJECTED           = 2;
}

message SubmitOrderResponse {
  string      order_id  = 1;
  OrderStatus status    = 2;
  string      reason    = 3; // populated on REJECTED
  uint64      block_idx = 4; // populated on CONFIRMED
  bytes       block_hash = 5;
}

message GetAccountRequest  { string user_id = 1; }
message GetAccountResponse {
  string              user_id   = 1;
  string              cash      = 2; // decimal as string
  map<string, string> positions = 3; // symbol -> shares
  uint64              last_nonce = 4;
}

// ============================================================================
// Node ↔ Node (PoA)
// ============================================================================

message ProposeBlockRequest  { Block block = 1; }
message ProposeBlockResponse {
  bool   approve = 1;
  string reason  = 2;
  bytes  signature = 3; // validator's sig over block.hash
  bytes  pubkey    = 4;
}

message CommitBlockRequest  { Block block = 1; }
message CommitBlockResponse { bool ok = 1; }

// ============================================================================
// Oracle → Node
// ============================================================================

message PriceUpdate {
  string symbol    = 1;
  string price     = 2;
  int64  timestamp = 3;
}

message PushPricesRequest  { repeated PriceUpdate prices = 1; }
message PushPricesResponse { bool ok = 1; }

// ============================================================================
// Services
// ============================================================================

// Called by Django (to Leader) and optionally by tools for debugging.
service TradingService {
  rpc SubmitOrder (SubmitOrderRequest) returns (SubmitOrderResponse);
  rpc GetAccount  (GetAccountRequest)  returns (GetAccountResponse);
}

// Internal PoA RPCs — authority nodes only.
service ConsensusService {
  rpc ProposeBlock (ProposeBlockRequest) returns (ProposeBlockResponse);
  rpc CommitBlock  (CommitBlockRequest)  returns (CommitBlockResponse);
}

// Oracle → Node price push.
service OracleSink {
  rpc PushPrices (PushPricesRequest) returns (PushPricesResponse);
}
